name: CI

on:
  push:
    branches:
      - master
      - v2
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_BASE_PATH: ${{ (github.ref_name == 'v2' || github.base_ref == 'v2') && '/v2' || '' }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate portal
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install locked dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check and build
        run: npm run build

      - name: Verify release routes
        run: npm run test:routes

      - name: Audit dependencies
        run: npm audit --audit-level=high
