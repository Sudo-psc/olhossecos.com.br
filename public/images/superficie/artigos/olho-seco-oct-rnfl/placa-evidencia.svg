  <text x="96" y="1760" fill="#00646A" font-family="Inter, Helvetica, sans-serif" font-size="22">Eixo come&#231;a em 80 &#181;m. A diferen&#231;a &#233; esta, n&#227;o um salto de zero.</text>
  <line x1="96" y1="1988" x2="1558" y2="1988" stroke="#8A6621" stroke-width="1.2"/>
  <text x="96" y="2050" fill="#8A6621" font-family="Inter, Helvetica, sans-serif" font-size="22">Oktay, Dursun, Y&#305;lmaz. Eur J Ophthalmol. 2021;31(6):2997-3002.</text>
  <text x="96" y="2092" fill="#8A6621" font-family="Inter, Helvetica, sans-serif" font-size="22">doi:10.1177/1120672121991395</text>
