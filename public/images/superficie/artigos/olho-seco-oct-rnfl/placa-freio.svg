  <text x="72" y="720" fill="#F7F3EA" font-family="Inter, Helvetica, sans-serif" font-size="18">Gershoni 2022 &#183; Strampe 2020 &#183; N&#227;o fundir plataforma. Sem IA que calibra filme.</text>
