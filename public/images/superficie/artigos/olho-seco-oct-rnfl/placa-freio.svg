  <rect x="72" y="160" width="500" height="480" fill="#F7F3EA"/>
  <text x="322" y="250" text-anchor="middle" fill="#8A6621" font-family="Noto Serif, Georgia, serif" font-size="22" letter-spacing="3">STRATUS / CIRRUS</text>
