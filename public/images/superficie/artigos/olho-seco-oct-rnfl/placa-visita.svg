<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img">
  <title>O que muda na cadeira</title>
  <rect width="1200" height="800" fill="#F7F3EA"/>
  <text x="72" y="96" fill="#0B1F33" font-family="Noto Serif, Georgia, serif" font-size="42" font-weight="700">O que muda na cadeira</text>
  <text x="72" y="210" fill="#8A6621" font-family="Noto Serif, Georgia, serif" font-size="36" font-weight="700">01</text>
  <text x="160" y="210" fill="#0B1F33" font-family="Noto Serif, Georgia, serif" font-size="34" font-weight="700">Piscar</text>
  <text x="160" y="250" fill="#00646A" font-family="Inter, Helvetica, sans-serif" font-size="22">Quinze segundos de secagem j&#225; saem do erro do Stratus.</text>
  <text x="72" y="350" fill="#8A6621" font-family="Noto Serif, Georgia, serif" font-size="36" font-weight="700">02</text>
  <text x="160" y="350" fill="#0B1F33" font-family="Noto Serif, Georgia, serif" font-size="34" font-weight="700">Ler o sinal</text>
  <text x="160" y="390" fill="#00646A" font-family="Inter, Helvetica, sans-serif" font-size="22">No eixo daquele aparelho. Stratus e Cirrus n&#227;o s&#227;o Spectralis.</text>
  <text x="72" y="490" fill="#8A6621" font-family="Noto Serif, Georgia, serif" font-size="36" font-weight="700">03</text>
  <text x="160" y="490" fill="#0B1F33" font-family="Noto Serif, Georgia, serif" font-size="34" font-weight="700">Tratar e repetir</text>
  <text x="160" y="530" fill="#00646A" font-family="Inter, Helvetica, sans-serif" font-size="22">OSD sobe o n&#250;mero. N&#227;o chamar progress&#227;o no scan seco.</text>
  <text x="72" y="630" fill="#8A6621" font-family="Noto Serif, Georgia, serif" font-size="36" font-weight="700">04</text>
  <text x="160" y="630" fill="#0B1F33" font-family="Noto Serif, Georgia, serif" font-size="34" font-weight="700">N&#227;o fechar</text>
  <text x="160" y="670" fill="#00646A" font-family="Inter, Helvetica, sans-serif" font-size="22">Scan ruim n&#227;o fecha piora. Nem no sentido errado da plataforma.</text>
</svg>
