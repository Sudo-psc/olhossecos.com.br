<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1654" height="2339" viewBox="0 0 1654 2339" role="img">
  <title>O que muda na cadeira</title>
  
  
  <rect width="1654" height="2339" fill="#F7F3EA"/>
  <text x="96" y="160" fill="#0B1F33" font-family="Noto Serif, Georgia, serif" font-size="56" font-weight="700">O que muda na cadeira</text>
  
  <rect x="96" y="240" width="1462" height="380" fill="#FFFFFF" stroke="#0B1F33" stroke-width="2"/>
  <rect x="96" y="240" width="92" height="380" fill="#0B1F33"/>
  <text x="142" y="450" text-anchor="middle" fill="#D9B665" font-family="Noto Serif, Georgia, serif" font-size="34" font-weight="700">01</text>
  <text x="240" y="390" fill="#0B1F33" font-family="Noto Serif, Georgia, serif" font-size="42" font-weight="700">Piscar</text>
  <text x="240" y="454" fill="#00646A" font-family="Inter, Helvetica, sans-serif" font-size="26">Quinze segundos de secagem j&#225; saem do erro do Stratus.</text>

  
  <rect x="96" y="660" width="1462" height="380" fill="#FFFFFF" stroke="#0B1F33" stroke-width="2"/>
  <rect x="96" y="660" width="92" height="380" fill="#0B1F33"/>
  <text x="142" y="870" text-anchor="middle" fill="#D9B665" font-family="Noto Serif, Georgia, serif" font-size="34" font-weight="700">02</text>
  <text x="240" y="810" fill="#0B1F33" font-family="Noto Serif, Georgia, serif" font-size="42" font-weight="700">Ler o sinal</text>
  <text x="240" y="874" fill="#00646A" font-family="Inter, Helvetica, sans-serif" font-size="26">No eixo daquele aparelho. Stratus e Cirrus n&#227;o s&#227;o Spectralis.</text>

  
  <rect x="96" y="1080" width="1462" height="380" fill="#FFFFFF" stroke="#0B1F33" stroke-width="2"/>
  <rect x="96" y="1080" width="92" height="380" fill="#0B1F33"/>
  <text x="142" y="1290" text-anchor="middle" fill="#D9B665" font-family="Noto Serif, Georgia, serif" font-size="34" font-weight="700">03</text>
  <text x="240" y="1230" fill="#0B1F33" font-family="Noto Serif, Georgia, serif" font-size="42" font-weight="700">Tratar e repetir</text>
  <text x="240" y="1294" fill="#00646A" font-family="Inter, Helvetica, sans-serif" font-size="26">OSD sobe o n&#250;mero. N&#227;o chamar progress&#227;o no scan seco.</text>

  
  <rect x="96" y="1500" width="1462" height="380" fill="#FFFFFF" stroke="#0B1F33" stroke-width="2"/>
  <rect x="96" y="1500" width="92" height="380" fill="#0B1F33"/>
  <text x="142" y="1710" text-anchor="middle" fill="#D9B665" font-family="Noto Serif, Georgia, serif" font-size="34" font-weight="700">04</text>
  <text x="240" y="1650" fill="#0B1F33" font-family="Noto Serif, Georgia, serif" font-size="42" font-weight="700">N&#227;o fechar</text>
  <text x="240" y="1714" fill="#00646A" font-family="Inter, Helvetica, sans-serif" font-size="26">Scan ruim n&#227;o fecha piora. Nem no sentido errado da plataforma.</text>


</svg>
